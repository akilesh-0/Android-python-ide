
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "main.py"
      - "buildozer.spec"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev \
            automake autopoint gettext libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            legacy-cgi \
            "Cython==0.29.34" \
            buildozer

      - name: Build debug APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee buildozer.log

      - name: Show build errors
        if: failure()
        run: |
          if [ -f buildozer.log ]; then
            echo "=== Matching errors ==="
            grep -nEi \
              "ERROR:|error:|Traceback|not a supported wheel|FAILED:|No space left" \
              buildozer.log | tail -40 || true
            echo "=== Last 60 log lines ==="
            tail -60 buildozer.log
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-python-ide-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
          
