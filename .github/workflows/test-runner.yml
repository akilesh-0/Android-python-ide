
name: Test Android IDE Build Environment

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test-runner:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Check Linux environment
        run: |
          echo "Our cloud build runner is working!"
          uname -a
          python3 --version
          java -version
          
